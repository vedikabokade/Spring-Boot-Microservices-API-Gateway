spring.application.name=api_gateway

server.port=8084

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.cloud.gateway.routes[0].id=employee_service
spring.cloud.gateway.routes[0].uri=http://localhost:8021
spring.cloud.gateway.routes[0].predicates[0]=Path=/employees/**

spring.cloud.gateway.routes[1].id=department_service
spring.cloud.gateway.routes[1].uri=http://localhost:8022
spring.cloud.gateway.routes[1].predicates[0]=Path=/departments/**
